# Hypercraft 同源网关：/api/* -> API（去前缀，含 WebSocket / SSE），其余 -> Web
# 作为 nginx 官方镜像模板使用：挂载到 /etc/nginx/templates/default.conf.template，
# 启动时用环境变量 HC_API_UPSTREAM / HC_WEB_UPSTREAM 替换（默认 api:8080 / web:3000）。
# 使用 Docker 内置 DNS 动态解析，容器重建后 IP 变化无需重启网关。

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 512m;

    set $hc_api ${HC_API_UPSTREAM};
    set $hc_web ${HC_WEB_UPSTREAM};

    location = /api { return 301 /api/; }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$hc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE 日志跟随 / PTY 终端：关闭缓冲、放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location / {
        proxy_pass http://$hc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
